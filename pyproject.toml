[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safe-git-mcp"
version = "0.1.0"
description = "Read-only, policy-filtered Git history MCP prototype"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2.11,<3"]

[project.scripts]
safe-git-mcp = "safe_git_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_git_mcp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
